# CI for https://github.com/BCBP-SOLUTIONS-FZC-LLC/workflow-models

# "Build image (cache)", "Lint Dockerfile", and "Smoke tests" are no-op
# placeholders — they always succeed and exist only so the org branch-
# protection ruleset resolves. This repo is a pure Go types library: no
# Dockerfile, no deployable image, no runtime to smoke-test. Request an
# exemption for Dockerfile-less repos from org admins when possible; until
# then, these three stay as documented no-ops.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-quality:
    name: Validate / Quality
    uses: ./.github/workflows/validate-quality.yml

  validate-test:
    name: Validate / Test
    uses: ./.github/workflows/validate-test.yml

  # Placeholder: no Dockerfile exists in this repo. See header comment.
  build-image-cache:
    name: Build image (cache)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-models has no Dockerfile/service image — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  # Placeholder: no Dockerfile exists in this repo. See header comment.
  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-models has no Dockerfile — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  trivy-cve-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compute cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Scan dependencies (no image to scan — filesystem/go.sum scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache-dir: .trivy-cache

  # Placeholder: a local-replace "import as an external consumer" check was
  # considered here, but it doesn't test anything "Validate / Test" doesn't
  # already cover (go build ./... against the same source) and never touches
  # the actual tagged/published artifact.
  # No genuine runtime/service surface exists in this repo to smoke-test.
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No-op placeholder
        run: echo "workflow-models is a types-only library with no runtime to smoke-test — placeholder to satisfy the org branch-protection ruleset. Request a Dockerfile-less-repo exemption when possible."

  pr-summary:
    name: PR summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request'
    needs: [validate-quality, validate-test, build-image-cache, lint-dockerfile, trivy-cve-scan, smoke-tests]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post summary
        uses: actions/github-script@v9
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const results = JSON.parse(process.env.JOB_RESULTS);
            const rows = Object.entries(results)
              .map(([job, info]) => `| ${job} | ${info.result} |`)
              .join('\n');
            const body = `### CI summary\n\n| Job | Result |\n| --- | --- |\n${rows}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
